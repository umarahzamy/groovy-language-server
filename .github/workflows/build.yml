name: build-groovy-ls

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: GroovyLanguageServer/groovy-language-server
          path: src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build jar
        working-directory: src
        run: ./gradlew clean build
      - id: ver
        name: Compute version
        run: |
          VER="v$(git -C src log -1 --format=%cs)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package tarball
        run: |
          mkdir -p dist/bin dist/lib
          mv src/build/libs/*-all.jar dist/lib/groovy-language-server.jar
          cat > dist/bin/groovy-language-server << 'EOF'
          #!/usr/bin/env sh
          DIR="$(cd "$(dirname "$(readlink -f "$0")")/../lib" && pwd)"
          exec java -jar "$DIR/groovy-language-server.jar" "$@"
          EOF
          chmod +x dist/bin/groovy-language-server
          tar -czf groovy-language-server.tar.gz -C dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: groovy-language-server.tar.gz
          archive: false
      - name: Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: groovy-language-server.tar.gz
